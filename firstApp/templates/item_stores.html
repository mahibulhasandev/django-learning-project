{% extends 'base.html' %}

{% block title %}Item Details{% endblock title %}

{% block body %}
    <h1 class="text-center justify-items-center">Form Page </h1>

    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Search Store</button>
    </form>

    {% if stores %}
    <h2>Stores availabe</h2>
    <ul>
        {% for store in stores %}
        <li>{{store.name}} - {{store.location}}</li>
        {% endfor %}
    </ul>
    {% endif %}
    
{% endblock body %}
